[project]
name = "ML4DC-MuonPOG"
version = "0.1.0"
description = "Small per-lumisection DIALS study for CMS Muon data certification"
requires-python = ">=3.12"
dependencies = [
    "cmsdials==2.2.0",
    "pandas",
    "pyarrow",
    "numpy",
    "matplotlib",
    "mplhep",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[dependency-groups]
metadata = ["requests", "pandas", "pyarrow", "tsgauth==0.12.0", "truststore"]
kerberos = ["tsgauth[kerb]==0.12.0"]
